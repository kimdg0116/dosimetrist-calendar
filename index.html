<script>if (/Android/i.test(navigator.userAgent)) document.documentElement.classList.add('android');
// 설명서 QR (?open=chrome / ?open=safari): 다른 브라우저(삼성 인터넷·카톡 등)로 열렸으면 크롬·사파리로 다시 연다. 주소의 표시는 지운다
(() => {
  const want = new URLSearchParams(location.search).get('open'), ua = navigator.userAgent, home = location.origin + location.pathname;
  if (!want) return;
  history.replaceState(null, '', home);
  if (want === 'chrome' && /Android/i.test(ua) && (!/Chrome\//.test(ua) || /SamsungBrowser|EdgA|OPR|Whale|KAKAOTALK|NAVER|; wv\)/.test(ua)))
    location.replace(`intent://${location.host}${location.pathname}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(home)};end`);
  if (want === 'safari' && /iPhone|iPad/.test(ua) && /CriOS|FxiOS|EdgiOS|KAKAOTALK|NAVER|Whale/.test(ua))
    location.replace('x-safari-' + home);                             // iOS 17 이상
})();
</script>
<style>
/* 색은 SMC 디자인 시스템 가이드라인 3.0 (1.5 Color) 기준
   Samsung Blue #1428a0 · SMC Blue #0a4bff (80% #2e70ff, 60% #508eff, 40% #8cbaff, 20% #bedaff)
   SMC Black 90% #191919 · 60% #666666 · 포인트 SMC Orange #ff871e (20% #ffe7d2) · SMC Red #fa4b50 */
:root {
  --font-body:"SUIT Variable", "Apple SD Gothic Neo", sans-serif;
  --bg:#eef5ff; --bg-top:#e3eeff; --card:#ffffff; --fg:#191919; --mute:#666666; --line:#dbe8ff;
  --acc:#2e70ff; --deep:#1428a0; --soft:#e8f1ff; --blue:#2e70ff; --sky:#00b4ff;
  --red:#fa4b50; --warn:#fa4b50; --orange:#ff871e; --clash:#ffe7d2; --toast:#1428a0; --orange-ink:#b04f00;
  --bar:rgba(227,238,255,.88); --bar-fg:#1428a0; --shadow:0 6px 22px rgba(46,112,255,.10); --card-border:transparent;
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1420; --bg-top:#142039; --card:#1a2233; --fg:#e9eef8; --mute:#9ba8bf; --line:#2b3750;
    --acc:#508eff; --deep:#8cbaff; --soft:#1d2c4d; --blue:#8cbaff; --sky:#33c3ff;
    --red:#fb6f73; --warn:#fb6f73; --orange:#ff9f4b; --clash:#33261a; --toast:#0a4bff; --orange-ink:#ffb46e;
    --bar:rgba(20,32,57,.88); --bar-fg:#e9eef8; --shadow:0 6px 22px rgba(0,0,0,.35); --card-border:#232e45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0f1420; --bg-top:#142039; --card:#1a2233; --fg:#e9eef8; --mute:#9ba8bf; --line:#2b3750;
  --acc:#508eff; --deep:#8cbaff; --soft:#1d2c4d; --blue:#8cbaff; --sky:#33c3ff;
  --red:#fb6f73; --warn:#fb6f73; --orange:#ff9f4b; --clash:#33261a; --toast:#0a4bff; --orange-ink:#ffb46e;
  --bar:rgba(20,32,57,.88); --bar-fg:#e9eef8; --shadow:0 6px 22px rgba(0,0,0,.35); --card-border:#232e45;
  color-scheme:dark;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:pan-x pan-y; }
html { touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%; }   /* 안드로이드 글자 자동 키움 끄기 */
body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }               /* 꾹 눌러도 글자 블록이 안 잡히게 (입력 칸은 그대로) */
input, textarea { -webkit-user-select:text; user-select:text; }
[hidden] { display:none !important; }
/* 글꼴 (웬들러식, 항목별로 하나씩 — 한 항목 안에서 글자마다 섞지 않는다): 본문·이름·제목 SUIT · 날짜·시간 항목과 영문 업무명 Oswald · 한글 업무명(온콜·당직) 페이퍼로지 */
body { margin:0; padding:0 16px 90px; font:16px/1.45 var(--font-body); background:linear-gradient(180deg, var(--bg-top) 0, var(--bg) 360px) no-repeat, var(--bg); color:var(--fg); letter-spacing:-.01em; }
button { font-family:inherit; cursor:pointer; }

/* 상단 바: 옅은 SMC Blue 20% 위에 흐림 효과 */
.top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  margin:0 -16px 14px; padding:calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  background:var(--bar); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); color:var(--bar-fg); }
.brand { flex:1; min-width:0; font-family:Oswald, sans-serif; font-weight:700; font-size:19px; letter-spacing:.1em; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon-btn { width:36px; height:32px; padding:0; font-size:15px; line-height:1; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--acc); }

/* 카드 */
.card { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
h3 { margin:0 0 10px; font-size:14px; font-weight:700; color:var(--mute); }
label { display:block; margin:14px 0 6px; font-size:13px; font-weight:600; color:var(--mute); }
input, select { width:100%; padding:11px 12px; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
input[type=time] { display:block; min-width:0; -webkit-appearance:none; appearance:none; min-height:44px; text-align:left; }
input:focus, select:focus, .datebtn:focus { outline:2px solid var(--acc); outline-offset:-1px; }
.two { display:flex; gap:8px; } .two > div { flex:1; min-width:0; }

/* 탭: 알약 모양 */
nav { display:flex; gap:4px; margin:6px 0 12px; padding:4px; border-radius:14px; background:var(--card); border:1px solid var(--card-border); box-shadow:var(--shadow); }
nav button { flex:1; padding:10px; font-size:15px; font-weight:600; border:0; border-radius:10px; background:none; color:var(--mute); }
nav button.on { background:var(--acc); color:#fff; box-shadow:0 2px 8px rgba(46,112,255,.3); }

/* 맨 위 두 블록: 앱을 열면 가장 먼저 보이게 */
.day { padding:16px 16px 12px; border-left:5px solid var(--deep); }
.day h3 .ttl::before { content:''; display:inline-block; width:10px; height:10px; margin:0 8px 3px 0; border-radius:50%; background:var(--deep); vertical-align:middle; }
.day h3 { display:flex; align-items:center; gap:6px; margin-bottom:8px; color:var(--fg); }
.day h3 .t { flex:1; min-width:0; }
.day h3 .ttl { display:block; font-size:22px; font-weight:800; letter-spacing:-.02em; }
.day h3 .ttl { color:var(--deep); }                               /* 두 블록 제목·점 같은 색 */
.day h3 .dt { display:block; margin-top:3px; font-size:14px; font-weight:500; color:var(--mute); }
.day h3 button { min-width:34px; height:32px; padding:0 10px; font-size:17px; line-height:1; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); }
.day h3 button:disabled { opacity:.3; }
.day h3 .back { font-size:13px; font-weight:600; color:var(--acc); }
.day h3 .cal svg { display:block; width:17px; height:17px; }
/* 업무 줄을 누르면 그날만 대신 설 사람 목록 */
.day details.line-dd { margin:0; border:0; border-top:1px solid var(--line); border-radius:0; background:none; }
.day details.line-dd:first-of-type { border-top:0; }
.day .line-dd summary { justify-content:flex-start; align-items:baseline; gap:8px; padding:8px 0; font-size:18px; font-weight:700; }
.day .line-dd summary > b { flex:0 0 116px; font-size:15px; font-weight:500; color:var(--mute); text-align:left; }
.day .line-dd summary > span { flex:1; min-width:0; color:var(--fg); font-size:18px; font-weight:700; }
.day .line-dd summary small { font-size:13px; font-weight:500; color:var(--mute); }
.day .line { display:flex; align-items:baseline; gap:8px; padding:8px 0; font-size:18px; font-weight:700; border-top:1px solid var(--line); }
.day .line:first-of-type { border-top:0; }
.day .line b { flex:0 0 116px; min-width:0; font-size:15px; font-weight:500; color:var(--mute); }
.day .line small { font-size:13px; font-weight:500; }
.line small.red { color:var(--red); font-weight:700; }
.day .empty { font-size:16px; }
/* 오늘/내일 일정: 이름이 많아도 읽히게 */
.ev { padding:10px 0; border-top:1px solid var(--line); cursor:pointer; }
.ev:first-of-type { border-top:0; padding-top:4px; }
.ev-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.kind { flex:none; padding:3px 10px; font-size:14px; font-weight:700; border-radius:999px; background:var(--soft); color:var(--acc); }
.ttl-line { display:flex; align-items:center; gap:8px; min-width:0; }
.ttl-line .memo { min-width:0; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.names { display:flex; flex-wrap:wrap; gap:2px 10px; font-weight:700; }

.ev .tm { font-size:15px; font-weight:600; color:var(--fg); }
.ev-names { margin-top:7px; font-size:18px; }
.ev-names.some { font-size:16px; } .ev-names.many { font-size:15px; gap:2px 8px; }   /* 4~6명, 7명 이상 */
.ev-sub { margin-top:4px; font-size:14px; color:var(--mute); }
#dayView { touch-action:pan-y; }
/* 업무 탭: 기간 한 장씩 (옆으로 밀거나 ‹ ›), 표 아이콘은 전체 보기 */
#pnav { display:flex; align-items:center; gap:6px; margin:0 2px 10px; scroll-margin-top:70px; }
#pnav .t { flex:1; min-width:0; }
#pnav .ttl { display:block; font-size:20px; font-weight:800; color:var(--deep); letter-spacing:-.02em; }
#pnav .dt { color:var(--mute); font-size:13px; font-weight:600; }
#pnav button { min-width:34px; height:32px; padding:0 10px; font-size:17px; line-height:1; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); }
#pnav button:disabled { opacity:.3; }
#pnav button svg { display:block; width:17px; height:17px; }
#periods { touch-action:pan-y; }
.in-l { animation:pin .18s ease-out; --dx:24px; } .in-r { animation:pin .18s ease-out; --dx:-24px; }
#leaves { touch-action:pan-y; }
@keyframes pin { from { opacity:.4; transform:translateX(var(--dx)); } }
#periods #addPeriod { margin-top:14px; }
#allRot { position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; background:rgba(10,20,60,.4); }
#allRot .sheet { width:100%; max-height:86vh; display:flex; flex-direction:column; padding:16px 0 calc(14px + env(safe-area-inset-bottom, 0px)); border-radius:20px 20px 0 0; background:var(--card); }
#allRot .hd { display:flex; align-items:center; padding:0 16px 10px; }
#allRot .hd b { flex:1; font-size:18px; font-weight:800; color:var(--deep); }
#allRot .hd button { height:32px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font-weight:600; }
#allRot .scroll { overflow:auto; }                                   /* 여백을 칸 안에 둬야 고정 열 왼쪽으로 내용이 비치지 않는다 */
#allRot tr > :first-child { padding-left:16px; } #allRot tr > :last-child { padding-right:16px; }
#allRot table { border-collapse:separate; border-spacing:0; font-size:14px; }
#allRot th, #allRot td { padding:8px 10px; white-space:nowrap; text-align:center; border-bottom:1px solid var(--line); }
#allRot thead th { position:sticky; top:0; z-index:1; background:var(--card); }
#allRot thead th button { padding:0; border:0; background:none; color:var(--mute); font:700 12px/1.3 inherit; }
#allRot tbody th { position:sticky; left:0; z-index:2; background:var(--card); text-align:left; color:var(--mute); font-weight:600; border-right:1px solid var(--line); }
#allRot thead th:first-child { left:0; z-index:3; color:var(--mute); font-size:12px; }
#allRot td { font-weight:700; }
#allRot .past { color:var(--mute); font-weight:500; }
#allRot .now { background:var(--soft); }
#allRot thead th.now button { color:var(--deep); }
#allRot .dot { display:inline-block; width:6px; height:6px; margin-left:3px; border-radius:50%; background:var(--orange); vertical-align:middle; }
#allRot .note { padding:10px 16px 0; color:var(--mute); font-size:12px; }

/* 일정 입력 */
details { margin-top:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
summary { display:flex; justify-content:space-between; gap:8px; padding:11px 12px; list-style:none; cursor:pointer; }
summary::-webkit-details-marker { display:none; }
summary span { color:var(--mute); font-size:14px; font-weight:600; }
summary b { min-width:0; font-weight:600; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
summary::after { content:'▾'; flex:none; margin-left:-4px; color:var(--mute); }
summary span { flex:none; }
/* 구분 · 이름을 한 줄에 나란히 */
.pick { display:flex; gap:8px; align-items:flex-start; }
:is(.pick details, details.dd) { position:relative; flex:1; min-width:0; }
.pick > .col { flex:1; min-width:0; }
details.dd { flex:1; margin-top:0; background:var(--bg); }
details.dd summary b { flex:1; text-align:left; }
#tFrom { flex:1; min-width:0; padding:0; font:inherit; font-weight:600; border:0; background:none; color:var(--fg); }
#tFrom:focus { outline:none; }
.pick > .col details { margin-top:0; }
.pick > .col summary b { flex:1; text-align:left; }
#lFrom .chip.on::after, #lHours .chip.on::after { content:none; }      /* 좁은 목록은 ✓ 대신 바탕색 */
#lFrom .chip.on, #lHours .chip.on { border-radius:8px; background:var(--soft); }
#lHours .chip { font-size:15px; }
/* 펼친 목록은 아래 칸을 밀지 않고 위에 겹쳐 뜬다 */
:is(.pick details, details.dd)[open] { z-index:15; }
:is(.pick details, details.dd) .chips { position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:15; max-height:55vh; overflow-y:auto; overflow-x:hidden;
  padding:4px 6px; border:1px solid var(--line); border-radius:12px; background:var(--card); box-shadow:0 10px 30px rgba(20,40,160,.18); }
:is(.pick details, details.dd) .chip { position:relative; justify-content:center; text-align:center; }      /* 가운데 정렬 */
:is(.pick details, details.dd) .chip.on::after { position:absolute; right:10px; }
:is(.pick details, details.dd).has summary span { display:none; }                  /* 고르면 '구분'·'이름' 글자는 숨겨 값이 다 보이게 */
:is(.pick details, details.dd).has summary b { flex:1; text-align:left; }
details[open] summary::after { content:'▴'; }
details .chips { padding:0 12px 12px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:7px 12px; font-size:15px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--fg); }
.chip.on { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
/* 구분·이름 고르기: 세로 목록, 고른 줄은 파란 글씨 + ✓ */
details .chips { flex-direction:column; flex-wrap:nowrap; gap:0; padding:0 6px 6px; }
details .chip:focus { outline:none; }
details .chip { display:flex; justify-content:space-between; align-items:center; width:100%; padding:12px 8px; font-size:16px; text-align:left;
  border:0; border-top:1px solid var(--line); border-radius:0; background:none; color:var(--fg); }
details .chip:first-child { border-top:0; }
details .chip.on { background:none; border-color:var(--line); color:var(--acc); font-weight:700; }
details .chip.on::after { content:'✓'; }
#fNames { max-height:50vh; overflow-x:hidden; overflow-y:auto; }
.seg { display:flex; gap:4px; margin-top:8px; padding:3px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
.seg button { flex:1; padding:8px; font-size:15px; border:0; border-radius:8px; background:none; color:var(--mute); }
.seg button.on { background:var(--card); color:var(--acc); font-weight:700; box-shadow:0 1px 4px rgba(20,40,160,.15); }
.main { width:100%; margin-top:18px; padding:13px; font-size:16px; font-weight:700; border:0; border-radius:12px; background:var(--acc); color:#fff; box-shadow:0 4px 12px rgba(46,112,255,.25); }
.main:disabled { opacity:.6; }
.sub { width:100%; padding:11px; font-size:15px; font-weight:600; border:1.5px dashed var(--line); border-radius:12px; background:none; color:var(--acc); }
.datebtn { width:100%; padding:11px 12px; font:inherit; font-size:16px; text-align:left; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
.datebtn.none { color:var(--mute); }

/* 목록 */
.item { display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
.item:first-of-type { border-top:0; }
.item .t { flex:1; min-width:0; cursor:pointer; font-weight:600; }
.item small { display:block; font-weight:400; color:var(--mute); }
.item .t { display:flex; align-items:baseline; gap:12px; }        /* 다가오는 일정: 날짜 → 내용 */
.item .when { flex:0 0 100px; font-weight:700; }
.item .when i { display:block; margin-top:3px; font-style:normal; font-size:13px; font-weight:500; color:var(--mute); }   /* 날짜 밑: 시간·장소 */
.item .when .w-tm { color:var(--fg); font-weight:600; }
.item .when small { display:block; font-size:inherit; font-weight:inherit; color:inherit; }
.item .what { flex:1; min-width:0; }
/* 다가오는 일정: 목록 / 주 / 월 */
.lhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.lhead h3 { margin:0; }
.vseg { display:flex; gap:2px; padding:3px; border-radius:10px; background:var(--bg); border:1px solid var(--line); }
.vseg button { padding:5px 12px; font-size:14px; border:0; border-radius:7px; background:none; color:var(--mute); }
.vseg button.on { background:var(--card); color:var(--acc); font-weight:700; box-shadow:0 1px 4px rgba(20,40,160,.15); }
.cnav { display:flex; align-items:center; justify-content:space-between; margin:4px 0 10px; }
.cnav b { font-size:16px; }
.cnav button { min-width:36px; height:32px; font-size:17px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
.wrow { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.wrow:first-of-type { border-top:0; }
.wrow.today { margin:0 -8px; padding-inline:8px; border-radius:10px; background:var(--soft); }

<script>
const APP_VERSION = '26.10.04-02';                                  // 올릴 때마다 version.json 과 같이 올린다

// 삼성 브라우저 설치 지원. 일정 데이터와 앱 화면은 캐시하지 않는다.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.warn);

document.getElementById('ver').textContent = 'v' + APP_VERSION;

// ── 확대 막기: 두 손가락 핀치, 빈 곳 더블탭 (웬들러와 같은 방식) ──
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  // 두 손가락: 시작부터 막는다 (갤럭시는 touchmove 만 막으면 일부 영역에서 확대가 시작됨)
  ['touchstart', 'touchmove'].forEach(t => document.addEventListener(t, e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false }));
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    const onControl = e.target.closest && e.target.closest('button,input,textarea,select,label,a,summary');
    if (!onControl && now - lastEnd < 350) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
})();

// ── 새 버전 안내: GitHub 의 version.json 과 비교해서 다르면 버튼을 띄운다 ──
(() => {
  let latest = '';
  const check = () => fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)

    .catch(() => {});
  document.getElementById('upd').addEventListener('click', () => location.replace('./?v=' + encodeURIComponent(latest || Date.now())));

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
})();
const KINDS = ['연차', '진료', '교육', '훈련', '회의', '출장', '기타'];
const ALL = '전원';                                                  // 파트원 모두 참석하는 일정
const DOW = '일월화수목금토';
let D, kind = '', mode = 'day', names = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => { const d = new Date(s + 'T00:00'); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const mdh = s => D.holidays[s] || new Date(s + 'T00:00').getDay() === 0 ? `<span class="red">${md(s)}</span>` : md(s);
const span = (s, e) => mdh(s) + (e && e !== s ? ' ~ ' + mdh(e) : '');
const mdNum = s => `${+s.slice(5, 7)}/${+s.slice(8)}`;           // '2026-11-01' → '11/1' (기간 머리글용, 요일·색 없음)
function addDays(s, n) {
  const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
const pad = n => String(n).padStart(2, '0');
const fmtTime = t => esc(t).replace(/\s*-\s*/, ' ~ ');          // '10:00-12:00' → '10:00 ~ 12:00'
// 이름 목록: 4~6명은 조금, 7명 이상은 더 작게
const namesHtml = (who, cls, eds) => who.length
  ? `<div class="names ${cls}${who.length >= 7 ? ' many' : who.length >= 4 ? ' some' : ''}">${who.map((n, k) => `<span${eds ? ` data-edit="${eds[k]}"` : ''}>${esc(n)}</span>`).join('')}</div>` : '';

// 하루치 일정 정리: 연차를 맨 위로 (종일 → 시간 순), 나머지는 등록 순서 그대로.
// 기간이 같은 종일 연차는 한 줄에 이름을 모은다 (시트에는 사람마다 따로 남고, 이름을 누르면 그 사람 것만 수정)
function arrange(evs) {
  const rank = l => l.kind === '연차' ? (l.time ? 1 : 0) : 2;
  const out = [], grp = {};
  [...evs].sort((a, b) => rank(a.l) - rank(b.l) || (rank(a.l) === 1 ? a.l.time.localeCompare(b.l.time) : 0)).forEach(e => {
    const l = e.l;
    if (l.kind !== '연차' || l.time || l.memo || l.place) return out.push(e);
    const k = l.start + '|' + l.end;
    if (!grp[k]) out.push(grp[k] = { rows: [] });
    grp[k].rows.push(e);
  });
  return out.map(g => {
    if (!g.rows) return g;
    if (g.rows.length === 1) return g.rows[0];
    const who = [], eds = [];
    g.rows.forEach(({ l, i }) => l.name.split(/,\s*/).filter(Boolean).forEach(n => { who.push(n); eds.push(i); }));
    return { l: { ...g.rows[0].l, name: who.join(', ') }, i: null, eds };
  });
}
const label = l => esc([l.name, l.memo].filter(Boolean).join(' · '));

// ── 하루 백업 ──
const AWAY = ['연차', '진료', '교육', '훈련', '출장', '오전반차', '오후반차'];   // 담당 업무와 겹치면 경고 (반차는 예전 기록용)
const ALL_WEEK = ['당직', '온콜'];                                  // 주말·공휴일도 근무. 나머지 업무는 평일만 본다
// 기본 백업: TOMO → 직전 기간 같은 업무 담당자, SGRT → 서버가 알려주는 담당(D.sgrtBackup). 당직·온콜은 직접 선택
const backupFor = (role, p, ri) => role.startsWith('TOMO') ? p.prevWho[ri] : role.startsWith('SGRT') ? D.sgrtBackup : '';
const SUB_RE = /^(.+) \((.+) 대신\)$/;

function* days(a, b) {
  for (let d = new Date(a + 'T00:00'); ; d.setDate(d.getDate() + 1)) {
    const s = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    if (s > b) return;
    yield [s, d.getDay()];
  }
}
const away = (name, day) => D.leaves.find(l => AWAY.includes(l.kind) && l.start <= day && day <= l.end && l.name.split(/,\s*/).includes(name));
const isSub = l => l.kind === '백업' || l.kind === '대체';          // '대체' 는 2026-10-02 이전 이름 (서버가 '백업'으로 바꿔 둔다)
const subs = () => D.leaves.map((l, i) => ({ l, i })).filter(({ l }) => isSub(l) && SUB_RE.test(l.memo))
  .map(({ l, i }) => { const [, role, orig] = l.memo.match(SUB_RE); return { i, day: l.start, role, orig, who: l.name }; });
const AR = '<svg class="ar" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8H3M7 4 3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';   // ← (SUIT 에선 '<' 로 보여서 직접 그린다)
const rl = n => `rl ${/[가-힣]/.test(n) ? 'ko' : 'en'}`;               // 업무명 글꼴: 온콜·당직 = 페이퍼로지, TOMO·SGRT = Oswald
const subFor = (role, day) => subs().find(s => s.role === role && s.day === day);

// 기간 p 안에서 담당자가 근태로 빠지는데 백업이 아직 없는 날
function clashes(p) {
  const out = [];
  D.roles.forEach((r, ri) => {
    const v = p.who[ri];
    if (!v) return;
    for (const [day, dow] of days(p.start > D.today ? p.start : D.today, p.end)) {
      if (!ALL_WEEK.includes(r.name) && (dow === 0 || dow === 6 || D.holidays[day])) continue;
      const l = away(v, day);
      if (!l || subFor(r.name, day)) continue;
      const rec = backupFor(r.name, p, ri);
      out.push({ day, ri, role: r.name, v, kind: l.kind + (l.time ? ' ' + l.time.replace(/\s*-\s*/, ' ~ ') : ''), rec: rec && rec !== v && !away(rec, day) ? rec : '' });
    }
  });
  return out.sort((a, b) => a.day < b.day ? -1 : 1);
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── 서버: Apps Script 웹 앱 (데이터만 주고받는다). 접근 코드·본인 이름은 이 폰에 기억 ──
const API_URL = 'https://script.google.com/macros/s/AKfycbx9edCqkSdDH_WXUhUyHx-V5TVKAMWQ2X8ZDNhDXV04eTYVotygX5CTqWVT8no5b4jK/exec';   // 배포 → 웹 앱 URL (…/exec)
let auth = {};
try { auth = JSON.parse(localStorage.getItem('auth') || '{}'); } catch (e) {}
const saveAuth = () => { try { localStorage.setItem('auth', JSON.stringify(auth)); } catch (e) {} };

// 이 기기 번호: 초인종을 누가 눌렀는지 (자기 신호는 무시)
const DEV = (() => { let d = ''; try { d = localStorage.getItem('dev') || ''; } catch (e) {}
  if (!d) { d = Math.random().toString(36).slice(2, 10); try { localStorage.setItem('dev', d); } catch (e) {} } return d; })();
// 연결 문제(요청이 끊김·서버가 이상한 답)는 e.net = true → 저장은 버리지 않고 다시 보낸다
const netErr = m => Object.assign(new Error(m), { net: true });
async function req(fn, args, oid) {
  let res, out;
  try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args, code: auth.code, who: auth.me || '', dev: DEV, oid }) }); }
  catch (e) { throw netErr('인터넷 연결이 끊겼습니다'); }                // 앱을 내리거나 잠그면 아이폰이 요청을 끊기도 한다
  try { out = await res.json(); } catch (e) { throw netErr('서버 응답을 받지 못했습니다'); }   // 구글 서버가 바쁠 때 오류 페이지
  if (out.ok) return out.data;
  if (out.error === 'AUTH') {                                         // 코드가 바뀌었거나 틀림 → 입력 창
    auth.code = ''; saveAuth();
    showGate(1, '접근 코드가 맞지 않습니다');
    throw new Error('접근 코드 확인 필요');
  }
  throw new Error(out.error);
}
const call = (fn, ...args) => req(fn, args);

// ── 저장: 화면은 바로, 서버는 차례로 ──
// S = 서버에서 받은 마지막 내용, D = 화면 = S 위에 아직 서버에 안 간 저장들(queued)을 미리 그린 것.
// 저장은 한 번에 하나씩 차례로 보낸다. 앞 저장이 끝나기 전에 또 바꿔도(방금 추가해 줄 번호가 아직 없는 일정 포함)
// 차례가 오면 S 에서 같은 일정을 '내용'으로 다시 찾아 그 줄을 고친다 (줄 번호는 지우기 등으로 밀릴 수 있어서)
let S = null, busy = 0, chain = Promise.resolve();
let queued = [];                                                      // 아직 서버가 받았다고 답하지 않은 저장들 = 보관함 (폰에도 저장)
const saveOutbox = () => { try { localStorage.setItem('outbox', JSON.stringify(queued)); } catch (e) {} };
const leafKey = l => [l.start, l.end, l.name, l.kind, l.time, l.memo, l.place || ''].join('|');
function apply_(op) {                                                  // 저장 하나를 화면(D)에 미리 반영
  const { fn, args } = op, L = D.leaves, f = args[args.length - 1];
  const at = () => op.key ? L.findIndex(l => leafKey(l) === op.key) : L.findIndex(l => l.row === args[0]);
  const item = () => ({ row: 0, sig: '', start: f.start, end: f.end || f.start, name: f.names.join(', '),
    kind: f.kind, time: f.time || '', memo: f.memo || '', place: f.place || '' });
  if (fn === 'deleteLeave' && at() >= 0) L.splice(at(), 1);
  else if (fn === 'updateLeave' && at() >= 0) L.splice(at(), 1, item());
  else if (fn === 'setRotation') {                                     // [행, 열, 새 담당, 예전 담당]
    const p = D.periods.find(p => p.col === args[1]), ri = D.roles.findIndex(r => r.row === args[0]);
    if (!p || ri < 0) return false;
    p.who[ri] = args[2];
  }
  else if (fn === 'addLeave') { const i = L.findIndex(l => l.start > f.start); L.splice(i < 0 ? L.length : i, 0, item()); }
  else return false;
  return true;
}
function redraw() {
  D = JSON.parse(JSON.stringify(S));
  queued.forEach(op => { try { apply_(op); } catch (e) {} });
  render();
}
function run(fn, args, msg, src) {                                    // src: 고치거나 지울 그 일정 (방금 저장해 줄 번호가 아직 없는 것도 내용으로 찾는다)
  const t = src || /^(update|delete)Leave$/.test(fn) && D.leaves.find(l => l.row === args[0] && l.sig === args[1]);
  const op = { fn, args, msg, key: t ? leafKey(t) : null, oid: DEV + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
  try { op.shown = apply_(op); } catch (e) {}
  queued.push(op); saveOutbox(); render();
  toast(op.shown ? msg : busy ? '앞 저장을 마치는 중…' : '저장 중…');
  return enqueue(op);
}
function enqueue(op) {
  busy++;
  const p = chain.then(() => send_(op));
  chain = p.catch(() => {});
  return p.finally(() => { busy--; });
}
// 저장 보내기. 연결 문제면 버리지 않고 2·4·8…초(최대 30초) 간격으로 다시 보낸다. 같은 고유 번호(oid)라 서버에서 두 번 적용되지 않는다
async function send_(op) {
  const drop = () => { const i = queued.indexOf(op); if (i >= 0) { queued.splice(i, 1); saveOutbox(); } };
  for (let n = 0; ; n++) {
    if (!op.sent) {                                                    // 처음 보낼 때 대상 줄을 정한다 (다시 보낼 땐 그대로)
      let args = op.args;
      if (op.key) {
        const cur = S.leaves.find(l => l.row > 0 && leafKey(l) === op.key);
        if (!cur) { drop(); redraw(); toast('그 일정이 이미 바뀌었습니다. 다시 확인해 주세요'); return false; }
        args = [cur.row, cur.sig, ...args.slice(2)];
      }
      if (op.fn === 'setRotation') {                                   // 같은 칸을 연달아 바꿔도 앞 저장 결과를 기준으로
        const pp = S.periods.find(p => p.col === args[1]), ri = S.roles.findIndex(r => r.row === args[0]);
        if (pp && ri >= 0) args = [args[0], args[1], args[2], pp.who[ri]];
      }
      op.sent = args; saveOutbox();
    }
    try {
      const r = await req(op.fn, op.sent, op.oid);
      drop(); setData(r.data);
      if (r.rang === false) ring();                                    // 서버가 못 눌렀으면 이 폰이 초인종을
      if (r.pend && r.pend.length) relay(r.pend);                      // 서버가 못 보낸 알림도 이 폰이 대신
      if (n > 0 || op.resumed) toast('밀려 있던 저장을 보냈습니다');
      else if (!op.shown) toast(op.msg);
      return true;
    } catch (e) {
      if (!e.net) { drop(); toast('실패: ' + e.message); load(); return false; }   // 내용 문제(다른 사람이 먼저 고침 등)
      if (n === 0) toast('연결이 불안정해 다시 보내는 중… (화면엔 반영돼 있어요)');
      await new Promise(r => setTimeout(r, Math.min(30000, 2000 * 2 ** n)));
    }
  }
}

function setData(d) {
  S = d; redraw();
  try { localStorage.setItem('data', JSON.stringify(d)); } catch (e) {}
}
async function load() {
  try { setData(await call('getData')); }
  catch (e) {
    if (D) toast('최신 내용을 못 불러왔습니다: ' + e.message);       // 저장본은 그대로 보여준다
    else $('#todayWork').innerHTML = `<span class="empty">불러오기 실패: ${esc(e.message)}</span>`;
  }
}
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

// 맨 위 두 카드: 옆으로 넘겨 다른 날 보기 (서버가 지난 30일치까지 보낸다)
let dayOff = 0;
const MIN_OFF = -30, MAX_OFF = 60;
const DAY_WORD = { '-1': '어제', 0: '오늘', 1: '내일', 2: '모레' };
function renderDay() {
  const day = addDays(D.today, dayOff);
  const word = DAY_WORD[dayOff] || '';
  const hol = D.holidays[day];
  const head = what => `<h3><span class="t"><span class="ttl">${word ? word + ' ' : ''}${what}</span><span class="dt">${mdh(day)}${hol ? ` <span class="red">${esc(hol)}</span>` : ''}</span></span>`
    + (dayOff ? '<button class="back" data-day="0">오늘</button>' : '')
    + '<button class="cal" data-daycal="1" aria-label="날짜 고르기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>'
    + `<button data-day="-1"${dayOff > MIN_OFF ? '' : ' disabled'}>‹</button><button data-day="1"${dayOff < MAX_OFF ? '' : ' disabled'}>›</button></h3>`;
  const cur = D.periods.find(p => p.start <= day && day <= p.end);
  $('#todayWork').innerHTML = head('업무') + (cur ? D.roles.map((r, i) => {
    const s = subFor(r.name, day);
    const out = !s && cur.who[i] && away(cur.who[i], day);
    const v = s && s.who !== s.orig ? `${esc(s.who)} <small>(${AR}${esc(s.orig)})</small>`
      : esc(cur.who[i]) + (out && !s ? ` <small class="red">(${esc(out.kind)} · 백업 없음)</small>` : '');
    if (!cur.who[i]) return s ? `<div class="line"><b class="${rl(r.name)}">${esc(r.name)}</b>${v}</div>` : '';
    const orig = cur.who[i], opts = D.people.includes(orig) ? D.people : [orig, ...D.people];
    return dd(`day|${i}|${day}`, opts.map(n => {                     // 누르면 그날만 대신 설 사람 고르기
      const a = away(n, day);
      return { v: n, t: n + (n === orig ? ' (원래 담당)' : a ? ` (${a.kind})` : '') };
    }), s ? s.who : orig, '', `<b class="${rl(r.name)}">${esc(r.name)}</b><span>${v}</span>`, ' line-dd');
  }).join('') : '<span class="empty">이 날짜의 업무 일정 없음</span>');
  const list = arrange(evOn(day));
  $('#todayLeave').innerHTML = head('일정') + (list.length
    ? list.map(({ l, i, eds }) => {
      const who = l.name.split(/,\s*/).filter(Boolean);
      const when = l.time ? fmtTime(l.time) : l.start !== l.end ? `${md(l.start)} ~ ${md(l.end)}` : '종일';
      return `<div class="ev"${i !== null ? ` data-edit="${i}"` : ''}>
        <div class="ev-top"><span class="ttl-line"><span class="kind">${esc(l.kind)}</span>${l.memo ? `<span class="memo">${esc(l.memo)}</span>` : ''}</span><span class="tm">${when}</span></div>
        ${namesHtml(who, 'ev-names', eds)}
        ${l.place ? `<div class="ev-sub">📍 ${esc(l.place)}</div>` : ''}</div>`;
    }).join('')
    : '<span class="empty">없음</span>');
}
// 달력에서 고른 날로 바로 (서버가 주는 범위 안에서만)
function goDay(v) {
  const n = Math.round((new Date(v + 'T00:00') - new Date(D.today + 'T00:00')) / 864e5);
  if (n < MIN_OFF || n > MAX_OFF) return toast('지난 30일 ~ 앞으로 60일까지만 볼 수 있어요');
  dayOff = n; renderDay();
}
function moveDay(n) {
  dayOff = n === 0 ? 0 : Math.min(MAX_OFF, Math.max(MIN_OFF, dayOff + n));
  renderDay();
}
// 옆으로 밀어 넘기기 (맨 위 블록·업무 기간·일정 주/월 공통)
// 세로 스크롤 중 손가락이 옆으로 조금 휘는 건 넘기기가 아니다 → 가로로 확실히 밀었을 때만. 왼쪽으로 밀면 다음
function swipe(el, go) {
  let t = null;
  el.addEventListener('touchstart', e => { t = e.touches.length === 1 && !e.target.closest('details[open]') ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
  el.addEventListener('touchcancel', () => { t = null; });
  el.addEventListener('touchend', e => {
    if (!t) return;
    const dx = e.changedTouches[0].clientX - t[0], dy = e.changedTouches[0].clientY - t[1];
    t = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
  });
}
swipe($('#dayView'), moveDay);

function render() {
  renderDay();
  const cur = D.periods.find(p => p.start <= D.today && D.today <= p.end);

  $('#fNames').innerHTML = [ALL, ...D.people].map(n => `<button class="chip${names.has(n) ? ' on' : ''}" data-n="${esc(n)}">${esc(n)}</button>`).join('');

    const p = D.periods[a[0]], r = D.roles[a[1]], cur = p.who[a[1]] || '';
    if (v === cur) return;
    if (!await ask(`${r.name} · ${mdNum(p.start)} ~ ${mdNum(p.end)}`, `${nm(cur)} ${ARR} ${nm(v)}<small>변경하시겠습니까?</small>`)) return;

      : `${nm(now)} ${ARR} ${nm(v)}<small>이 날만 바꾸시겠습니까?</small>`, v === orig ? '되돌리기' : '변경')) return;
    if (v === orig && !away(orig, day)) run('deleteLeave', [l.row, l.sig], `${md(day)} ${role} 원래대로 (${orig})`);
    else if (l) run('updateLeave', [l.row, l.sig, { start: day, end: '', names: [v], kind: '백업', time: '', memo: l.memo }], `${md(day)} ${role} 백업: ${v}`);

      `${md(l.start)} ${v === l.memo.match(SUB_RE)[2] ? '백업 불필요' : '백업: ' + v}`);
  }

const FROMS = [];

  list.style.maxHeight = (last.offsetTop + last.offsetHeight + items[0].offsetTop) + 'px';   // 위아래 여백 포함 5칸
  const i = Math.max(0, Math.min(items.length - SHOW, (anchor ? items.indexOf(anchor) : 0) - 2));
  list.scrollTop = items[i].offsetTop - items[0].offsetTop;
}, true);
// ── 날짜 고르기 (기본 달력은 공휴일을 칠할 수 없어서 직접 그린다) ──
const getD = id => $('#' + id).dataset.v || '';
function setD(id, v) {
  if (id === 'dayPick') return goDay(v);
  const b = $('#' + id);
  b.dataset.v = v;
  b.classList.toggle('none', !v);
  b.innerHTML = v ? mdh(v) : '선택 안 함';
}
let pick = {};
function openPicker(id) {
  const v = getD(id) || getD('fStart') || D.today;
  pick = { id, y: +v.slice(0, 4), m: +v.slice(5, 7) - 1 };
  $('#pClear').hidden = id === 'fStart' || id === 'dayPick';
  drawPicker(); $('#picker').hidden = false;
}
function drawPicker() {
  const { y, m, id } = pick, ym = `${y}-${pad(m + 1)}`, sel = getD(id);
  const first = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  $('#pTitle').textContent = `${y}년 ${m + 1}월`;
  let html = [...DOW].map((w, i) => `<span class="dow${i === 0 ? ' red' : i === 6 ? ' sat' : ''}">${w}</span>`).join('') + '<span></span>'.repeat(first);
  for (let d = 1; d <= n; d++) {
    const v = `${ym}-${pad(d)}`, dow = (first + d - 1) % 7;
    const cls = [D.holidays[v] || dow === 0 ? 'red' : dow === 6 ? 'sat' : '', v === D.today ? 'today' : '', v === sel ? 'sel' : ''].join(' ');
    html += `<button type="button" class="${cls}" data-pick="${v}">${d}</button>`;
  }
  $('#pGrid').innerHTML = html + '<span class="pad"></span>'.repeat(42 - first - n);   // 늘 6주 칸
  $('#pHols').innerHTML = Object.keys(D.holidays).filter(k => k.startsWith(ym)).sort()
    .map(k => `<div>${+k.slice(8)}일 ${esc(D.holidays[k])}</div>`).join('');
  const per = {};                                                      // 공휴일 칸은 공휴일이 가장 많은 달 줄 수만큼 → 달마다 크기가 같다
  Object.keys(D.holidays).forEach(k => per[k.slice(0, 7)] = (per[k.slice(0, 7)] || 0) + 1);
  $('#pHols').style.minHeight = `calc(13px * 1.6 * ${Math.max(1, ...Object.values(per))})`;
}
function closePicker() { $('#picker').hidden = true; }
applyKind();

// ── 일정 수정: 누른 일정을 폼에 채우고, 저장하면 그 줄을 고친다 ──
let editing = null;
// 그날로 새 일정 쓰기 (월 보기에서 고른 날을 한 번 더 눌렀을 때)
function addOn(day) {
  resetForm(); setD('fStart', day); openForm(true);
  $('#fToggle').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function openForm(on) { $('#fBody').hidden = !on; $('#fToggle').classList.toggle('open', on); }
function resetForm() {
  editing = null; kind = ''; mode = 'day'; names.clear();
  openForm(false);
  setD('fStart', D.today); setD('fEnd', ''); $('#fMemo').value = ''; $('#fPlace').value = '';
  setTime('09:00', 1);
  document.querySelectorAll('#fNames .chip.on').forEach(x => x.classList.remove('on'));
  $('#fTitle').textContent = '일정 추가'; $('#save').textContent = '저장'; $('#editBtns').hidden = true;

}
// 저장 실패 때 폼 되살리기 (새 일정이면 '일정 추가' 상태로)
function refill(f, ed) {
  startEdit({ ...(ed || {}), name: f.names.join(', '), kind: f.kind, time: f.time, start: f.start, end: f.end || f.start, memo: f.memo, place: f.place });
  if (!ed) { editing = null; $('#fTitle').textContent = '일정 추가'; $('#save').textContent = '저장'; $('#editBtns').hidden = true; }
  openForm(true);
}
function startEdit(l) {
  editing = l; kind = l.kind;
  names = new Set(l.name.split(/,\s*/).filter(Boolean));
  const t = l.time.match(/(\d{1,2}):(\d{2})(?:\s*-\s*(\d{1,2}):(\d{2}))?/);
  mode = t ? 'hour' : 'day';
  if (t) {
    const h = t[3] ? Math.round((t[3] * 60 + +t[4] - t[1] * 60 - +t[2]) / 60) : 1;
    setTime(`${pad(+t[1])}:${t[2]}`, Math.min(8, Math.max(1, h)));
  }
  setD('fStart', l.start); setD('fEnd', l.end !== l.start ? l.end : '');
  $('#fMemo').value = l.memo; $('#fPlace').value = l.place || '';
  document.querySelectorAll('#fNames .chip').forEach(x => x.classList.toggle('on', names.has(x.dataset.n)));
  $('#fTitle').textContent = '일정 수정'; $('#save').textContent = '수정 저장'; $('#editBtns').hidden = false;
  openForm(true);

  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'leave'));
  $('#leave').hidden = false; $('#rot').hidden = true;

}

document.addEventListener('click', async e => {
  const so = e.target.closest('[data-subopen]');

  const ed = e.target.closest('[data-edit]');

    const l = D.leaves[ed.dataset.edit];
    if (editing && editing.row === l.row && leafKey(editing) === leafKey(l)) return resetForm();
    return startEdit(l);
  }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) {

  } else if (b.dataset.k) {

  } else if (b.dataset.cd) {                                           // 월 보기 날짜: 한 번 = 고르기, 고른 날을 한 번 더 = 그날 일정 추가
    if (calTap === b.dataset.cd) { calTap = ''; renderLeaves(); addOn(b.dataset.cd); }

  } else if (b.dataset.a) {

  } else if (b.dataset.n) {

    if (names.has(n)) names.delete(n);
    else { if (n === ALL) names.clear(); else names.delete(ALL); names.add(n); }   // '전원' 과 개별 이름은 같이 못 고름
    document.querySelectorAll('#fNames .chip').forEach(x => x.classList.toggle('on', names.has(x.dataset.n)));
    applyNames();
  } else if (b.dataset.i) {
    if (!b.classList.contains('armed')) {                            // confirm() 은 구글 앱 화면 안에서 막혀 있어 두 번 누르기
      b.classList.add('armed'); b.textContent = '한 번 더 누르면 삭제';
      return setTimeout(() => { b.classList.remove('armed'); b.textContent = '삭제'; }, 3000);
    }
    const l = D.leaves[b.dataset.i];
    openSub = null;
    run('deleteLeave', [l.row, l.sig], '삭제됨');
  } else if (b.dataset.subclose) {
    openSub = null; render();
  } else if (b.dataset.sub) {
    const [pi, ri, day] = b.dataset.sub.split('|');
    const c = clashes(D.periods[pi]).find(x => x.ri === +ri && x.day === day);
    const who = subPick[`${pi}|${ri}|${day}`] ?? (c ? c.rec : '');
    const role = D.roles[ri].name, orig = D.periods[pi].who[ri];
    if (!who) return toast('백업을 지정해 주세요');
    run('addLeave', [{ start: day, end: '', names: [who], kind: '백업', time: '', memo: `${role} (${orig} 대신)` }],
      `${md(day)} ${role} ${who === orig ? '백업 불필요' : '백업: ' + who}`);           // 이름 = 원래 담당이면 '백업 불필요' (시트에만 기록)
  } else if (b.id === 'save') {
    const f = {
      start: getD('fStart'), kind, names: [...names], memo: $('#fMemo').value.trim(), place: $('#fPlace').value.trim(),
      end: $('#wEnd').hidden ? '' : getD('fEnd'),

    };
    if (!kind) return toast('구분을 골라 주세요');
    if (kind === '기타' && !f.memo) return toast('무엇인지 적어 주세요');
    if (!f.start || !(f.names.length || f.memo)) return toast('날짜와 이름(모두면 "전원")을 넣어 주세요');
    // 화면엔 바로 반영되니 입력칸도 바로 비우고, 서버 답(캘린더·알림까지 몇 초)은 기다리지 않는다 → 바로 다음 수정 가능.
    // 서버엔 저장 차례대로 간다. 실패하면 (다른 걸 고치는 중이 아닐 때) 적은 내용을 되살린다
    const ed = editing;
    resetForm();
    (ed ? run('updateLeave', [ed.row, ed.sig, f], '수정됨', ed) : run('addLeave', [f], '저장됨'))
      .then(ok => { if (!ok && !editing) refill(f, ed); });
  } else if (b.id === 'delEdit') {
    if (!b.classList.contains('armed')) {                            // 두 번 누르기
      b.classList.add('armed'); b.textContent = '한 번 더 누르면 삭제';
      return setTimeout(() => { b.classList.remove('armed'); b.textContent = '삭제'; }, 3000);
    }
    b.classList.remove('armed'); b.textContent = '삭제';
    const ed = editing;
    resetForm();
    if (!await run('deleteLeave', [ed.row, ed.sig], '삭제됨', ed) && !editing) startEdit(ed);
  } else if (b.id === 'cancelEdit') {
    resetForm();
  } else if (b.id === 'fToggle') {                                     // 제목 줄: 펼치기/접기 (수정 중이면 수정 취소)
    if (editing) resetForm(); else openForm($('#fBody').hidden);
  } else if (b.dataset.open) {
    openPicker(b.dataset.open);
  } else if (b.dataset.pm) {
    pick.m += +b.dataset.pm;
    if (pick.m < 0) { pick.m = 11; pick.y--; } else if (pick.m > 11) { pick.m = 0; pick.y++; }
    drawPicker();
  } else if (b.dataset.pick) {
    setD(pick.id, b.dataset.pick);
    if (pick.id === 'fStart' && getD('fEnd') && getD('fEnd') < b.dataset.pick) setD('fEnd', '');   // 종료일이 시작일보다 앞이면 비움
    closePicker();
  } else if (b.id === 'pClear') {
    setD(pick.id, ''); closePicker();
  } else if (b.id === 'pToday') {
    setD(pick.id, D.today); closePicker();
  } else if (b.id === 'pClose') {
    closePicker();
  } else if (b.id === 'theme') {

  } else if (b.dataset.daycal) {

  } else if (b.dataset.day !== undefined) {
    moveDay(+b.dataset.day);
  } else if (b.id === 'addPeriod') {
    b.disabled = true;                                               // 연타해도 한 번만
    if (await run('addPeriod', [], '기간 추가됨')) { pSlide = 'l'; pPage = D.periods.length - 1; render(); }   // 새 기간으로
    b.disabled = false;
  } else if (b.dataset.pg) {
    movePeriod(+b.dataset.pg);
  } else if (b.dataset.allrot) {
    openAllRot();
  } else if (b.dataset.goper !== undefined) {
    $('#allRot').hidden = true;
    const k = +b.dataset.goper;
    pSlide = k > pPage ? 'l' : k < pPage ? 'r' : ''; pPage = k; openSub = null; render();
    $('#pnav').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (b.id === 'allClose') {
    $('#allRot').hidden = true;
  }
});


$('#picker').addEventListener('click', e => { if (e.target.id === 'picker') closePicker(); });
// 구분·이름 목록: 바깥을 누르면 닫힘
document.addEventListener('click', e => {
  document.querySelectorAll(':is(.pick details, details.dd)[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
});   // 바깥 누르면 닫힘

// ── 테마: 자동(◐) → 라이트(☀) → 다크(☾). 기기에 기억 ──
const THEMES = ['system', 'light', 'dark'], THEME_ICON = { system: '◐', light: '☀', dark: '☾' };
let theme = 'system';
try { theme = THEMES.includes(localStorage.getItem('theme')) ? localStorage.getItem('theme') : 'system'; } catch (e) {}
function setTheme(t) {
  theme = t;
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  $('#theme').textContent = THEME_ICON[t];
  try { localStorage.setItem('theme', t); } catch (e) {}
}
setTheme(theme);

// ── 첫 화면: 접근 코드 → 본인 이름 (한 번만) ──
let pickMe = '';
function showMe() { $('#meName').hidden = !auth.me; $('#meName').textContent = auth.me || ''; }
function showGate(step, msg) {
  $('#gate').hidden = false;
  $('#gStep1').hidden = step !== 1; $('#gStep2').hidden = step !== 2;
  $('#gMsg').textContent = msg || '';
  if (step === 1) { $('#gCode').value = ''; setTimeout(() => $('#gCode').focus(), 50); }
  if (step === 2) {
    pickMe = '';
    $('#gNames').innerHTML = D.people.map(n => `<button type="button" data-me="${esc(n)}">${esc(n)}</button>`).join('');
    $('#gMeOk').disabled = true; $('#gMeOk').textContent = '이름을 골라 주세요';
  }
}
async function submitCode() {
  const code = $('#gCode').value.trim();
  if (!/^\d{6}$/.test(code)) { $('#gMsg').textContent = '6자리 숫자를 넣어 주세요'; return; }
  auth.code = code; $('#gMsg').textContent = '확인 중…';
  try {
    setData(await call('getData'));
    saveAuth(); initForm();
    if (auth.me) $('#gate').hidden = true; else showGate(2);
  } catch (e) {
    if (auth.code) $('#gMsg').textContent = e.message;               // 코드가 틀린 경우는 call() 이 이미 안내
  }
}
$('#gGo').addEventListener('click', submitCode);
$('#gCode').addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });
$('#gate').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.me) {
    pickMe = b.dataset.me;
    document.querySelectorAll('#gNames button').forEach(x => x.classList.toggle('on', x === b));
    $('#gMeOk').disabled = false; $('#gMeOk').textContent = `${pickMe} 님으로 시작`;
  } else if (b.id === 'gMeOk' && pickMe) {
    auth.me = pickMe; saveAuth(); showMe(); $('#gate').hidden = true;
  }
});

function initForm() {
  if (!getD('fStart')) setD('fStart', D.today);
  setD('fEnd', getD('fEnd'));
}
async function start() {
  showMe();
  if (!auth.code) return showGate(1);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('data') || 'null'); } catch (e) {}
  listen();
  let ob = [];
  try { ob = JSON.parse(localStorage.getItem('outbox') || '[]'); } catch (e) {}
  if (saved) { S = saved; S.today = localToday(); queued = ob; redraw(); initForm(); if (!ob.length) await pull(true); }   // 저장본으로 바로 그리고, 바뀐 게 있을 때만 받기
  else await load();
  if (ob.length && S) {                                                // 지난번에 못 보낸 저장 이어 보내기 (같은 번호라 중복 없음)
    queued = ob; redraw(); toast(`보내지 못한 저장 ${ob.length}건을 다시 보냅니다`);
    ob.forEach(op => { op.resumed = true; enqueue(op); });
  }
  if (D) { initForm(); if (!auth.me) showGate(2); }
}
// ── 여러 기기 동기화 ──
// 1) 초인종: 앱이 화면에 있는 동안 ntfy 초인종 방을 듣는다. 누가 저장하면 서버가 누르고 → 1~2초 안에 새로 받음
// 2) 받기는 한 번에: pull(내 변경 번호) → 그대로면 빈 답, 바뀌었으면 전체 데이터
// 3) 보험: 초인종을 놓쳐도 30초마다 확인. 앱을 다시 열 때도 바로 확인
// 고르는 중·수정 중·저장 중엔 화면을 바꾸지 않고 '받을 게 있음'만 기억했다가, 끝나면 받는다
const BELL = 'smc-dose-bell-c84ec6618b6cfd37';
const idle = () => document.visibilityState === 'visible' && auth.code && D && !editing && !busy
  && $('#picker').hidden && $('#allRot').hidden && $('#ask').hidden && !document.querySelector('details[open]');
let pending = false, pulling = false;
async function pull(showErr) {
  if (!idle() || pulling) { pending = true; return; }
  pending = false; pulling = true;
  try {
    const r = await call('pull', D.rev || '');
    if (r.pend) { relay(r.pend); delete r.pend; }                       // 서버가 못 보낸 알림이 남아 있으면 이 폰이 대신
    if (!r.same) { if (idle()) setData(r); else pending = true; }
  } catch (e) { if (showErr) toast('최신 내용을 못 불러왔습니다: ' + e.message); }
  finally { pulling = false; }
}
// 서버(구글 공용 IP)가 ntfy 한도(429)에 막혀 못 보낸 알림을 이 폰이 대신 보내고, 서버 보관함에서 지운다
async function relay(list) {
  const done = [];
  for (const m of list) {
    try { if ((await fetch('https://ntfy.sh/', { method: 'POST', body: JSON.stringify({ topic: m.topic, title: m.title, message: m.message }) })).ok) done.push(m.id); } catch (e) {}
  }
  if (done.length) call('ntfyDone', done).catch(() => {});
}
function ring() { fetch('https://ntfy.sh/' + BELL, { method: 'POST', body: DEV }).catch(() => {}); }
let bell = null;
function listen() {
  if (bell || !auth.code || document.visibilityState !== 'visible' || typeof EventSource === 'undefined') return;
  bell = new EventSource('https://ntfy.sh/' + BELL + '/sse');
  bell.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === 'message' && m.message !== DEV) pull(); } catch (err) {} };
}
let tick = 0;
setInterval(() => {                                                    // 3초마다: 미뤄 둔 게 있으면 받고, 30초마다는 그냥 확인
  if (document.visibilityState !== 'visible') return;
  if (++tick % 10 === 0 || pending) pull();
}, 3000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { listen(); if (D) pull(); }
  else if (bell) { bell.close(); bell = null; }                         // 내려 두면 연결을 끊는다 (배터리)
});
start();
</script>
